{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <!-- Dashboard Header -->
    <div class="mb-4">
        <h2 class="fw-bold mb-1">Admin Dashboard</h2>
        <p class="text-muted mb-0">
            Overview of your store
        </p>
    </div>

    <!-- Statistics Cards -->
    <div class="row g-3 g-md-4">

        <!-- Total Users -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body p-4 text-center">

                    <div class="mb-3">
                        <span
                            class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle"
                            style="width: 60px; height: 60px; font-size: 28px;"
                        >
                            👥
                        </span>
                    </div>

                    <h2 class="fw-bold mb-1">
                        {{ total_users }}
                    </h2>

                    <p class="text-muted mb-0">
                        Total Users
                    </p>

                </div>
            </div>
        </div>

        <!-- Total Products -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body p-4 text-center">

                    <div class="mb-3">
                        <span
                            class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle"
                            style="width: 60px; height: 60px; font-size: 28px;"
                        >
                            📦
                        </span>
                    </div>

                    <h2 class="fw-bold mb-1">
                        {{ total_products }}
                    </h2>

                    <p class="text-muted mb-0">
                        Total Products
                    </p>

                </div>
            </div>
        </div>

        <!-- Total Orders -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body p-4 text-center">

                    <div class="mb-3">
                        <span
                            class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle"
                            style="width: 60px; height: 60px; font-size: 28px;"
                        >
                            🛒
                        </span>
                    </div>

                    <h2 class="fw-bold mb-1">
                        {{ total_orders }}
                    </h2>

                    <p class="text-muted mb-0">
                        Total Orders
                    </p>

                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
