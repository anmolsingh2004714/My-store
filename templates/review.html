{% extends "base.html" %}

{% block title %}Write Review{% endblock %}

{% block content %}

<div class="container-fluid py-4 py-md-5">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">


            <div class="card border-0 shadow-lg rounded-4">


                <div class="card-body p-4 p-sm-5">


                    <!-- Header -->
                    <div class="text-center mb-4">

                        <div
                            class="d-inline-flex align-items-center justify-content-center
                                   bg-warning bg-opacity-10 text-warning rounded-circle mb-3"
                            style="width:75px;height:75px;font-size:35px;"
                        >
                            ⭐
                        </div>


                        <h2 class="fw-bold mb-2">
                            Write Review
                        </h2>


                        <p class="text-muted mb-0">
                            Share your experience with this product
                        </p>

                    </div>



                    <!-- Review Form -->
                    <form method="POST">


                        <!-- Rating -->
                        <div class="mb-3">


                            <label
                                for="rating"
                                class="form-label fw-semibold"
                            >
                                Rating (1-5)
                            </label>


                            <select
                                id="rating"
                                name="rating"
                                class="form-select form-select-lg"
                            >

                                <option value="5">
                                    ⭐⭐⭐⭐⭐ Excellent
                                </option>

                                <option value="4">
                                    ⭐⭐⭐⭐ Good
                                </option>

                                <option value="3">
                                    ⭐⭐⭐ Average
                                </option>

                                <option value="2">
                                    ⭐⭐ Poor
                                </option>

                                <option value="1">
                                    ⭐ Bad
                                </option>

                            </select>


                        </div>




                        <!-- Review Text -->
                        <div class="mb-4">


                            <label
                                for="review"
                                class="form-label fw-semibold"
                            >
                                Your Review
                            </label>


                            <textarea
                                id="review"
                                name="review"
                                class="form-control"
                                rows="5"
                                placeholder="Write your feedback here..."
                                required
                            ></textarea>


                        </div>




                        <!-- Submit Button -->
                        <button
                            type="submit"
                            class="btn btn-success btn-lg w-100 rounded-3"
                        >
                            ⭐ Submit Review
                        </button>



                    </form>


                </div>


            </div>


        </div>


    </div>


</div>


{% endblock %}
