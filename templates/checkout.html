{% extends "base.html" %}

{% block title %}Checkout{% endblock %}

{% block content %}

<div class="container-fluid py-4 py-md-5">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body text-center p-4 p-sm-5">

                    <!-- Success Icon -->
                    <div
                        class="d-inline-flex align-items-center justify-content-center
                               bg-success bg-opacity-10 text-success rounded-circle mb-4"
                        style="width: 80px; height: 80px; font-size: 42px;"
                    >
                        ✓
                    </div>

                    <!-- Heading -->
                    <h2 class="fw-bold mb-3">
                        Order Placed Successfully!
                    </h2>

                    <!-- Message -->
                    <p class="text-muted mb-4">
                        🎉 Thank you for your order!
                        Your order has been placed successfully.
                    </p>

                    <hr class="my-4">

                    <!-- Continue Shopping -->
                    <a
                        href="{{ url_for('products') }}"
                        class="btn btn-success btn-lg w-100 rounded-3"
                    >
                        🛍️ Continue Shopping
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
