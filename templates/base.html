<!-- Bootstrap CSS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<!-- Custom CSS -->
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/style.css') }}"
/>

<!-- Responsive Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
  <div class="container-fluid px-3 px-lg-4">

    <!-- Brand -->
    <a class="navbar-brand fw-bold fs-4" href="/">
      🛍️ MyStore
    </a>

    <!-- Mobile Toggle Button -->
    <button
      class="navbar-toggler border-0"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbar"
      aria-controls="navbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Menu -->
    <div class="collapse navbar-collapse" id="navbar">

      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">

        <!-- Home -->
        <li class="nav-item">
          <a class="nav-link px-3" href="/">
            🏠 Home
          </a>
        </li>

        <!-- Products -->
        <li class="nav-item">
          <a class="nav-link px-3" href="{{ url_for('products') }}">
            🛍️ Products
          </a>
        </li>

        <!-- Cart -->
        <li class="nav-item">
          <a class="nav-link px-3" href="{{ url_for('cart') }}">
            🛒 Cart
          </a>
        </li>

        <!-- Orders -->
        <li class="nav-item">
          <a class="nav-link px-3" href="{{ url_for('orders') }}">
            📋 Orders
          </a>
        </li>

        <!-- Admin -->
        <li class="nav-item">
          <a class="nav-link px-3" href="{{ url_for('admin') }}">
            ⚙️ Admin
          </a>
        </li>

        <!-- Wishlist -->
        <li class="nav-item">
          <a class="nav-link px-3" href="{{ url_for('wishlist') }}">
            ❤️ Wishlist
          </a>
        </li>

        <!-- Profile -->
        <li class="nav-item">
          <a class="nav-link px-3" href="{{ url_for('profile') }}">
            👤 Profile
          </a>
        </li>

        <!-- Manage Orders -->
        <li class="nav-item">
          <a class="nav-link px-3" href="{{ url_for('admin_orders') }}">
            📦 Manage Orders
          </a>
        </li>

        <!-- Login -->
        <li class="nav-item">
          <a class="nav-link px-3" href="/login">
            🔐 Login
          </a>
        </li>

        <!-- Register -->
        <li class="nav-item">
          <a class="nav-link px-3" href="/register">
            📝 Register
          </a>
        </li>

      </ul>

    </div>
  </div>
</nav>


<!-- Main Content -->
<main class="container-fluid px-3 px-md-4 px-lg-5 py-3">
  {% block content %}
  {% endblock %}
</main>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
